plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.dbz_ssd_recompiled'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.dbz_ssd_recompiled'
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName '0.3.6'
    }

    // A release build is signed when SSD_KEYSTORE_PROPERTIES names a properties file (storeFile, storePassword,
    // keyAlias, keyPassword) kept outside the repository; without it the release APK is unsigned, as before.
    def signing = System.getenv('SSD_KEYSTORE_PROPERTIES')
    if (signing) {
        def props = new Properties()
        file(signing).withInputStream { props.load(it) }
        signingConfigs {
            release {
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            if (signing) {
                signingConfig signingConfigs.release
            }
        }
    }

    // libmain.so and libSDL3.so, put in jniLibs/<abi>/ by android/build-apk.sh.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
