# Super Saiyan Goku HD: the Super Saiyan Goku's 27 battle poses redrawn with the hair standing up (not canon; Enhanced mode only, off unless the pack is enabled).
[pack]
id = "ssj.goku.hd"
name = "Super Saiyan Goku HD"
version = "1.0.0"
game = "A8CF4F2A"
description = "Redraws Super Saiyan Goku in battle: golden hair in tall sharp spikes that rise past the box of the original sprite."

# Each picture is the pose redrawn, grown by 76 art pixels on each side so the hair can rise past the original box (docs/mods/art.md,
# "Pose variants"). The pictures are made locally from the installed HD art and are never tracked; without them the pack loads and
# the poses are drawn as they are.

[[pose_variant]]
art = "battle-goku-ssj-000"
when = "always"
file = "art/hd/variants/battle-goku-ssj-000.png"
margin = 76

