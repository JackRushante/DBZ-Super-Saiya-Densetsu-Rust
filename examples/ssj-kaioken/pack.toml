# Super Saiyan Kaioken: the Kaioken for the Super Saiyan Goku (not canon; Enhanced mode only, off unless the pack is enabled).
[pack]
id = "ssj.kaioken"
name = "Super Saiyan Kaioken"
version = "1.0.0"
game = "A8CF4F2A"
description = "Goku can use the Kaioken while he is a Super Saiyan, up to x10. While both are on, each move costs 10 percent of his maximum HP."

[[tables]]
file = "tables.toml"

[[feature]]
name = "ssj_kaioken"
max_factor = 10
hp_cost_percent = 10

# The Kaioken over the Super Saiyan Goku's poses (docs/mods/art.md): each picture is the pose redrawn with the aura, made
# locally from the installed HD art (`xtask kaioken-art examples/ssj-kaioken`). Without the pictures the pack loads and the
# poses are drawn as they are.

[[pose_variant]]
art = "battle-goku-ssj-000"
when = "kaioken"
file = "art/hd/variants/battle-goku-ssj-000.png"
margin = 24

