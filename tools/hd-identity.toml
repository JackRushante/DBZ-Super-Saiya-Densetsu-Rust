# Looks of one character that are told apart: art made for one must never draw the other.
# Each list is a family whose members are distinct looks.
[forms]
vegeta = ["vegeta", "vegeta-ssj"]
goku = ["goku", "goku-ssj"]

# What the label of the art (its description, its fighter, its id, the subject of its prompt) must
# say for it to show the identity: any of `words` (default: the slug and its family), and for a
# look told apart any of `form_words`; none of `not_words`. Lower case, matched as text.
[identities.j-saibaman]
words = ["saibaman", "j-sai"]
[identities.saibaman]
words = ["saibaman", "saibai"]
[identities.saimen]
words = ["saimen", "saibaman"]
[identities.baimen]
words = ["baimen", "saibaman"]
[identities.imite]
words = ["imite", "saibaman"]
[identities.grimen]
words = ["grimen", "saibaman"]
[identities.k-kai]
words = ["king kai", "k-kai", "kaio"]
[identities.vegeta]
describe = "Vegeta: black flame-shaped upright hair with a widow's peak, dark eyes, a stern face, blue bodysuit, white gloves and boots, white Saiyan armour with yellow shoulder pads."
words = ["vegeta"]
not_words = ["super saiyan"]
[identities.vegeta-ssj]
describe = "Super Saiyan Vegeta: golden upright hair with a widow's peak, teal eyes, a stern face, blue bodysuit, white gloves and boots, white Saiyan armour with yellow shoulder pads."
words = ["vegeta"]
form_words = ["super saiyan", "golden"]
[identities.goku]
describe = "Son Goku: spiky black hair, dark eyes, orange gi with a blue undershirt, blue belt and wristbands, blue boots."
words = ["goku"]
not_words = ["super saiyan"]
[identities.goku-ssj]
describe = "Super Saiyan Son Goku: spiky golden upright hair, teal eyes, orange gi with a blue undershirt, blue belt and wristbands, blue boots."
words = ["goku"]
form_words = ["super saiyan", "golden"]
[identities.ginyu-u98]
words = ["ginyu", "goku"]
[identities.dende]
describe = "Dende, a Namekian child: small body with a child's proportions, green skin, bald head with two short antennae, long pointed ears, big round eyes and a young round face, plain light clothes. Not an adult warrior: no turban, cape or muscles."
words = ["dende"]
[identities.nail-u34]
