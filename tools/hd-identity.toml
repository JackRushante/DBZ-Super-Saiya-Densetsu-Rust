# Who each unit and portrait of the game is, for `xtask hd-catalogue verify`: the check that a picture
# of the HD art shows the character the game draws there.
#
# Written in our own words; nothing here is copied from the ROM. A slug is the identity of one
# look of one character: `vegeta` and `vegeta-ssj` are two looks that must never share art. A slug
# of the form `<name>-u<N>` is a unit that shares its name with others and whose look has not been
# told apart yet (it is compared by family, the name, not as a separate look).
#
# Unit numbers are decimal, as the art's file names have them (`gallery-enemy-vegeta-u75-005` is
# made for unit 75, $4B; Super Saiyan Goku is unit 59, $3B).

