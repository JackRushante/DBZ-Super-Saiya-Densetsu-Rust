[identities.goku-u60]
describe = "Son Goku with golden Super Saiyan hair (this unit's palette gives him golden spiky hair, as the native sprite shows): orange gi with a blue undershirt, blue belt and wristbands, blue boots."
[identities.goose]
describe = "A Frieza Force fighter in the same sprite as Jeice, in other colours: bright green hair, pale skin, white and red battle armour with orange shoulder pads, pale blue legs."
[identities.strock-u48]
describe = "A Frieza Force fighter in the same sprite as Jeice, in other colours: blue-violet hair, tan skin, a green armoured top with a white shoulder cape, tan legs."
[identities.zoak]
describe = "A soldier of Frieza's army in the standard shoulder-pad battle armour: green skin, purple and blue armour with orange shoulder pads."
[identities.bugy]
