[identities.bundt]
describe = "A soldier of Frieza's army in the standard shoulder-pad battle armour: green hair, grey-blue armour, red trousers, orange shoulder pads."
# Art made for a look that its file names do not number (a `battle-*` set, or a close-up set): the
# art's stem, the id without the pose number, to the slugs it is made for. A stem with `-u<N>` in
# it is made for unit N and needs no line.
[art]
battle-goku = ["goku"]
battle-goku-ssj = ["goku-ssj"]
gallery-party-goku-ssj = ["goku-ssj"]
battle-gohan = ["gohan"]
battle-krillin = ["krillin"]
