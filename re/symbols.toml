# re/symbols.toml — names are ours; code addresses are physical ($00–$1F banks).
#
# The single source of names and addresses (spec §5.2): Rust code refers to routines by name.
# Read by ssd_oracle::Symbols; errors name this file and the line.
#
# [[routine]]                  hooked routines (added from M1a Task 8)
# name = "advance_x_by_6"      Rust function name in ssd-game's registry ([a-z_][a-z0-9_]*)
# address = 0x008B0E           physical PBR:PC of the entry (banks $00-$1F, offsets $8000-$FFFF)
# returns = "rtl"              "rts" | "rtl"
# timing = "pure"              "pure" | "mmio" | "sync"
# mode = "verify"              "original" | "rust" | "verify"
# entry_m8 = true              optional: required accumulator width at entry
# entry_x8 = false             optional: required index width at entry
# flags = "NZ"                 optional: compared flags, letters from NVMXDIZC, each once
#                              (absent: all flags; "": no flags compared)
# verify_sample = 1            optional, default 1 (every call)
# cycles = 108                 optional: the routine's MAXIMUM cost over its paths, in CPU-busy
#                              MASTER cycles from the hit to the return (measured by Verify; not
#                              CPU cycles). Rust mode runs the routine only when no timing event
#                              can come within it, and never without it; each call is charged
#                              the exact cost its Rust function declares
#
# [[table]]                    a read-only region of the ROM (WRAM data is a [[variable]])
# name = "id_category_table"
# address = 0x0D8200           physical, like a routine's (banks $00-$1F, offsets $8000-$FFFF)
# size = 128                   bytes; the table ends in its bank, tables do not overlap
#
# [[variable]]                 named memory; divergence reports name the bytes inside
# name = "in_battle"
# address = 0x7E0364           24-bit bus address of the first byte
# size = 1                     optional, default 1
#
# [[sync_point]]               where lockstep compares two machines: the first arrival after
# name = "main_loop_idle"      each NMI (ssd_oracle::Machine::run_until_sync)
# address = 0x0080CE           physical code address, like a routine's; never a routine's
#
# Names are unique across routines, tables, variables and sync points. ssd-game's build script
# turns every [[table]] and [[variable]] into the constants NAME (the address) and NAME_SIZE in
# ssd_game::data, so Rust code never repeats these addresses. The direct-page scratch of
# bin24_to_packed_bcd ($00-$08) is not named here: it is documented in the routine.

# Routines: the M1 candidates of docs/re/m1-candidates.md (semantics, contracts, callers).

