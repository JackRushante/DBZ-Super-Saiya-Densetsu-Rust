name = "face_portrait_pointers"  # 3 bytes per face index (the party record's second byte; 00 Goku, 01 Piccolo, 09 Gohan, 0A Krillin, 0B Tien, 0C Yamcha, 0D Chiaotzu, 50 Vegeta, 61 Dende), the 24-bit address of the compressed set (word, then bank byte); read by 01:CA98 for the corner faces of the field menu (menus.md, "Corner faces")
address = 0x02A3B4
size = 315

[[table]]
name = "object_portrait_pointers"  # 3 bytes per object id (0..39): the 24-bit address of the compressed picture (word, then bank byte); read by 00:C559 (menus.md, "Portraits")
address = 0x02A4EF
size = 120

[[table]]
name = "object_portrait_halves"   # one bit per object id (0..39), least significant bit first: which of the two pictures of the object's shared set it shows (menus.md, "Portraits")
address = 0x02A58F
size = 5

[[table]]
name = "object_portrait_palettes"   # a word per object id (0..39): the address in bank $09 of its 16-colour palette (menus.md, "Portraits")
address = 0x02A356
size = 80

# M5 cheats research (docs/re/data/battle.md): the battle's damage, EXP and encounter bytes and tables.

[[variable]]
name = "battle_party_offset"       # word: offset in party_records of the party fighter whose turn it is (its side record is side_record_a)
address = 0x7E14C3
size = 2

[[variable]]
name = "battle_enemy_offset"       # word: offset from $0E00 of the active enemy slot (its side record is side_record_b)
address = 0x7E14C5
size = 2

[[variable]]
name = "battle_hit_flag"           # $14CC: 0 = the attack is dodged (damage is computed, not applied), non-zero = it hits
address = 0x7E14CC
size = 1

[[variable]]
name = "battle_hit_class"          # $14CD: severity of a hit for the animation (2, 3, 4 by damage against maximum HP; 1 graze, 0 miss)
address = 0x7E14CD
size = 1

[[variable]]
name = "battle_damage"             # $14CF: the damage of the turn, 24 bits; computed by 05:B804, subtracted from HP by 05:BDDC
address = 0x7E14CF
size = 3

[[variable]]
name = "battle_repeat"             # $14DF: attacks in a row by the same side on the same target (1, 2, 3...); lowers the defender's card value
address = 0x7E14DF
size = 1

[[variable]]
name = "battle_exp_award"          # $14F3: the EXP of the battle so far, 24 bits (1D:8C33 adds each defeated enemy's reward, 05:8FAA gives it to every fighter)
address = 0x7E14F3
size = 3

[[variable]]
name = "battle_drops"             # $14F6: the three objects the enemies drop, $FF = none (05:8F4D)
address = 0x7E14F6
size = 3

[[variable]]
name = "enemy_count"               # $0EA0: enemies in the battle (set by 01:F692, lowered by the KO routine 05:A9AA)
address = 0x7E0EA0
size = 1

[[variable]]
name = "enemy_formation"           # $0EA5: the screen formation of the group, derived from the count by 01:B8DE
address = 0x7E0EA5
size = 1

[[variable]]
name = "encounter_timer"           # $AA: counts down once a frame while walking or flying; at a negative value 02:D1F6 rolls for a battle and reloads $3B
address = 0x7E00AA
size = 1

[[variable]]
name = "encounter_level"           # $0D8A: the zone's encounter level (0 none), plus the failed rolls; a battle starts when it is at least the roll (1 to 16)
address = 0x7E0D8A
size = 1

[[variable]]
name = "encounter_zone"            # $0D8B: the encounter zone the leader stands in on this map (0 none)
address = 0x7E0D8B
size = 1

[[table]]
name = "encounter_zone_pointers"   # 48 words (bank $02): per map, a list of rectangles (x range, y range, zone number) read by 02:D38B
address = 0x02D4A4
size = 96

[[table]]
name = "encounter_zone_levels"     # 4 bytes per map, at map * 4 + zone: the encounter level of the zone (0 or 1)
address = 0x02D62A
size = 192

[[table]]
name = "encounter_group_pointers"  # 48 words (bank $02): per map, rows of 8 encounter group numbers per zone (one picked by $51 & 7 at 02:D34A)
address = 0x02D6EA
size = 96

# Text engine (docs/re/data/text-engine.md): what the message engine (01:CBE0) prints and where.

[[variable]]
name = "message_line"              # $071E: the line of the page being written (0 first); the tile-map row is $0721 + $80 per line
address = 0x7E071E
size = 1

[[variable]]
name = "message_text_base"         # $0721: word, tile-map byte offset (in tilemap_buffer $7E:3000) of the first cell of the window's text: message_window_offsets[message_table], or system_string_offsets[message_string] for table 7
address = 0x7E0721
size = 2

[[variable]]
name = "message_string"            # $0723: word, the index of the string being written in its string table (message_table); the object id for an item help
address = 0x7E0723
size = 2

[[variable]]
name = "message_page_end"          # $0728: word, the tile-map offset where the last page stopped (saved at FE, FF FF and FD)
address = 0x7E0728
size = 2

[[variable]]
name = "message_word"              # $072A: word, the index of the next word of the message's list (the string being written is the word before it)
address = 0x7E072A
size = 2

[[variable]]
name = "message_number"            # $072C: word, the message: its index in the list table message_lists points at (07:8000 dialogue, 07:D79E battle)
address = 0x7E072C
size = 2

[[variable]]
name = "message_handler"           # $072E: $80 + nn while the handler nn of an E0nn word runs (01:D433, table at 01:D43B)
address = 0x7E072E
size = 1

[[variable]]
name = "message_indent"            # $0731: word added to the cell offset of the line (bit 15: subtracted); $8002 after a portrait (F4), cleared at each line end
address = 0x7E0731
size = 2

[[variable]]
name = "message_table"             # $0733: the string table of the message (the low byte of its D0nn word): 0 help, 1 battle, 2 talk, 3 story, 4 to 6 wishes, 7 system
address = 0x7E0733
size = 1

[[variable]]
name = "message_lists"             # $0738: 24-bit pointer to the table of message lists: 07:8000 (message_pointers) or 07:D79E, which leads to battle_message_list
address = 0x7E0738
size = 3

[[variable]]
name = "message_saved_speed"       # $01D1: the player's text_speed while the engine forces another speed (restored at each page end)
address = 0x7E01D1
size = 1

[[variable]]
name = "battle_message_list"       # $14E2: the battle's one-string message list in WRAM: D001, the string index (word at $14E4), FFFF; built by 05:9391
address = 0x7E14E2
size = 6

[[variable]]
name = "message_name_buffer"       # $1600: the name or number a slot code (F6-FB) is copied into before it is written, $FF-ended
address = 0x7E1600
size = 16

[[variable]]
name = "message_number_slots"      # $1610, $1620, $1630: three $FF-ended tile strings (numbers) for the slot codes F8, F7, F6
address = 0x7E1610
size = 0x30

[[variable]]
name = "message_name_slots"        # $1640: three words (index, type) for the slot codes FB, FA, F9; type bit 7 unit, 6 object, 5 attack, 4 the table at 02:B204
address = 0x7E1640
size = 6

[[table]]
name = "message_pointers"          # 368 words (bank $07): the list of each message, words: D0nn picks string table nn, E0nn runs handler nn, FFFF ends, others are string indexes
address = 0x078000
size = 736

[[table]]
name = "message_window_offsets"    # 8 words, one per string table: the tile-map offset of the text (message_text_base)
address = 0x01CCB4
size = 16

[[table]]
name = "system_string_offsets"     # 8 words, one per string of table 7: the tile-map offset of its text (the windows are placed per string)
address = 0x078F06
size = 16

[[table]]
name = "string_table_pointers"     # 8 x 3 bytes: the 24-bit address of each string table (word, then bank), read at 3 * message_table
address = 0x078F16
size = 24

[[table]]
name = "battle_message_pointers"   # 338 words (bank $07), string table 1: item_help_pointers from index 42 on, the battle's messages
address = 0x078F82
size = 676

[[table]]
name = "story_string_pointers"     # 167 words (bank $07), string table 3: narration and townspeople
address = 0x079226
size = 334

[[table]]
name = "wish_string_pointers"      # 9 words (bank $07), string table 4: the dragon scenes
address = 0x079374
size = 18

[[table]]
name = "wish_string_pointers_5"    # 2 words (bank $07), string table 5
address = 0x079386
size = 4

[[table]]
name = "wish_string_pointers_6"    # 2 words (bank $07), string table 6
address = 0x07938A
size = 4

[[table]]
name = "system_string_pointers"    # 8 words (bank $07), string table 7: short lines placed per string by system_string_offsets
address = 0x07938E
size = 16

[[table]]
name = "inline_phrase_pointers"    # 8 words (bank $07): the phrase a string code E0-E7 writes in place (01:D18E)
address = 0x07939E
size = 16

[[table]]
name = "talk_string_pointers"      # 366 words (bank $06), string table 2: the dialogue with portraits (F4 nn)
address = 0x068000
size = 732
